<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajeshwari Portfolio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

.card{

width:90%;
max-width:500px;

padding:40px;

text-align:center;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(20px);

border-radius:20px;

color:white;

animation:fade .7s;

}

h1{
margin-bottom:10px;
}

p{
margin-bottom:25px;
color:#ddd;
}

button{

padding:12px 30px;

border:none;

border-radius:10px;

background:white;

cursor:pointer;

font-size:16px;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

@keyframes fade{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="card">

<h1>Rajaeshwari</h1>

<p>Click below to view portfolio.</p>

<button onclick="window.location.href='https://rajeswari-modern-portfolio.netlify.app/'">
Open Portfolio
</button>

</div>

</body>

</html>
